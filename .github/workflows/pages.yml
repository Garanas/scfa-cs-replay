# Publishes the Blazor WebAssembly viewer as a static site on GitHub Pages
# (https://garanas.github.io/scfa-cs-replay/). Requires Settings → Pages → Source: "GitHub Actions".
#
# Only the Viewer is deployed, not FAForever.Replay.Server: everything works without it except
# signing in, which needs the server's OAuth token proxy (or FAF allowing CORS on the token
# endpoint) and a client registered for this origin. See TODO.md.

name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one that is under way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project pages live in a subfolder named after the repository. Use "/" for a custom domain.
  BASE_PATH: /${{ github.event.repository.name }}/
  PUBLISH_DIR: publish/wwwroot

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The committed wwwroot/css/app.css is used: the Tailwind CLI is Windows-only here.
      - name: Publish viewer
        run: dotnet publish FAForever.Replay.Viewer/FAForever.Replay.Viewer.csproj -c Release -o publish --nologo

      - name: Prepare for GitHub Pages
        working-directory: ${{ env.PUBLISH_DIR }}
        run: |
          # Resolve all app paths below the repository subfolder.
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|" index.html
          grep -q "<base href=\"${BASE_PATH}\" />" index.html
          # Deep links (/replay/123?tab=chat) are not files: Pages serves 404.html, which boots the app.
          cp index.html 404.html
          # Serve folders that start with an underscore (_framework).
          touch .nojekyll
          # Pages does not negotiate pre-compressed files; they only double the upload.
          find . -type f \( -name '*.br' -o -name '*.gz' \) -delete
          # Retire the service worker of the previous deployment.
          cp "${GITHUB_WORKSPACE}/.github/pages/service-worker.js" service-worker.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
