# The production stack on your own machine, built from source, without Let's Encrypt:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up --build
#
# Then open http://vault.localhost (or https:// with Traefik's self-signed certificate).
# Signing in does not work here: the Production redirect URI points at vault.jipwijnia.nl.

services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true

  vault:
    image: scfa-cs-replay:local
    build:
      context: ..
    labels:
      traefik.http.routers.vault.rule: Host(`vault.localhost`)
      # Plain HTTP as well, so no certificate warning is needed to try it.
      traefik.http.routers.vault-http.rule: Host(`vault.localhost`)
      traefik.http.routers.vault-http.entrypoints: web
      traefik.http.routers.vault-http.service: vault
