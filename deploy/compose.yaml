# Production stack on the VPS: Traefik in front (HTTPS with Let's Encrypt, HTTP → HTTPS) and the
# replay vault (FAForever.Replay.Server with the viewer). Other sites, such as jipwijnia.nl itself,
# join as extra services with their own traefik.* labels. See deploy/README.md.
#
#   cp .env.example .env    # once, then fill it in
#   docker compose pull && docker compose up -d

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Every router on websecure gets a certificate from Let's Encrypt, so services only need
      # a Host rule. The HTTP-01 challenge is answered on port 80 before the redirect.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  vault:
    image: ${VAULT_IMAGE:-ghcr.io/garanas/scfa-cs-replay:latest}
    restart: unless-stopped
    environment:
      # Trust X-Forwarded-For from Traefik: the container publishes no ports, so only Traefik
      # reaches it. The token proxy rate-limits per client address.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    mem_limit: 256m
    labels:
      traefik.enable: "true"
      traefik.http.routers.vault.rule: Host(`${VAULT_HOST:-vault.jipwijnia.nl}`)
      traefik.http.routers.vault.entrypoints: websecure
      traefik.http.services.vault.loadbalancer.server.port: "8080"

  # Visitor statistics (goatcounter.com): no cookies, no personal data, SQLite in a volume.
  # The viewer counts itself when Analytics:GoatCounter is set (appsettings.Production.json).
  # Create the first site from the command line right after the first start, before anyone
  # else can reach the setup wizard; see deploy/README.md.
  goatcounter:
    image: arp242/goatcounter:2.7
    restart: unless-stopped
    volumes:
      - goatcounter:/home/goatcounter/goatcounter-data
    mem_limit: 128m
    labels:
      traefik.enable: "true"
      traefik.http.routers.stats.rule: Host(`${STATS_HOST:-stats.jipwijnia.nl}`)
      traefik.http.routers.stats.entrypoints: websecure
      traefik.http.services.stats.loadbalancer.server.port: "8080"

volumes:
  letsencrypt:
  goatcounter:
