<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAF Replays</title>
    <base href="/" />
    <meta name="description" content="Search, inspect and analyse Supreme Commander: Forged Alliance Forever replays." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <script>
        // Apply the persisted faction and light/dark mode before first paint to avoid a flash
        // (keep in step with fafReplay.applyMode in js/app.js). "auto" follows the system setting.
        (function () {
            var root = document.documentElement;
            var faction = null, mode = null;
            try {
                faction = window.localStorage.getItem("faf-theme");
                mode = window.localStorage.getItem("faf-mode");
            } catch (e) { }
            if (faction) {
                root.setAttribute("data-faction", faction);
            }
            if (mode !== "light" && mode !== "dark") {
                mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            root.setAttribute("data-mode", mode);
        })();
    </script>
</head>

<body>
    <div id="app">
        <style>
            .faf-splash {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                min-height: 100dvh;
                color: var(--th-ink-muted, #a2aaba);
                font-family: system-ui, sans-serif;
            }

            .faf-splash-dot {
                width: 0.875rem;
                height: 0.875rem;
                border-radius: 9999px;
                background: var(--th-primary, #e54b4b);
                box-shadow: 0 0 18px var(--th-glow, rgba(229, 75, 75, 0.35));
                animation: faf-pulse 1.2s ease-in-out infinite;
            }

            @keyframes faf-pulse {
                50% { transform: scale(1.6); opacity: 0.55; }
            }
        </style>
        <div class="faf-splash">
            <div class="faf-splash-dot"></div>
            <span>Loading FAF Replays&hellip;</span>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:1000; padding:0.75rem 1.25rem; background:#b91c1c; color:#fff; font-family:system-ui,sans-serif;">
        An unhandled error has occurred.
        <a href="." class="reload" style="color:#fff; text-decoration:underline;">Reload</a>
        <span class="dismiss" style="float:right; cursor:pointer;">&#10060;</span>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
